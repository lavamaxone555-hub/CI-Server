name: Project-App CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: retail_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Quality verification
        run: npm run verify
      - name: Lint
        run: npm run lint
      - name: Run live PostgreSQL integration suite
        run: npm run test
        env:
          POSTGRES_INTEGRATION_URL: postgresql://postgres:postgres@localhost:5432/retail_test
          POSTGRES_INTEGRATION_SSL: "false"
      - name: CI release evidence verification
        run: npm run test -- src/application/postgresCiReleaseEvidence.integration.test.ts
        env:
          POSTGRES_INTEGRATION_URL: postgresql://postgres:postgres@localhost:5432/retail_test
          POSTGRES_INTEGRATION_SSL: "false"
